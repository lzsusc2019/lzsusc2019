<svg xmlns="http://www.w3.org/2000/svg" width="854" height="180" viewBox="0 0 854 180" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="854" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E1B4B"/>
      <stop offset="0.55" stop-color="#150F2E"/>
      <stop offset="1" stop-color="#0B0718"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="854" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="854" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <style>
      @keyframes flow { from { transform: translateX(0); } to { transform: translateX(-854px); } }
      @keyframes pulse { 0%, 100% { opacity: 0.08; } 50% { opacity: 0.22; } }
      .w1 { animation: flow 12s linear infinite; }
      .w2 { animation: flow 18s linear infinite; }
      .w3 { animation: flow 26s linear infinite; }
      .g1 { animation: pulse 6s ease-in-out infinite; }
      .g2 { animation: pulse 8s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="854" height="180" fill="url(#bg)"/>

  <circle class="g1" cx="760" cy="34" r="58" fill="#7C3AED"/>
  <circle class="g2" cx="92" cy="150" r="46" fill="#A78BFA"/>

  <g class="w3">
    <path d="M0 138 Q213 108 427 138 T854 138 V180 H0 Z" fill="url(#wave1)" opacity="0.14"/>
    <path d="M854 138 Q1067 108 1281 138 T1708 138 V180 H854 Z" fill="url(#wave1)" opacity="0.14"/>
  </g>
  <g class="w2">
    <path d="M0 154 Q213 128 427 154 T854 154 V180 H0 Z" fill="url(#wave1)" opacity="0.22"/>
    <path d="M854 154 Q1067 128 1281 154 T1708 154 V180 H854 Z" fill="url(#wave1)" opacity="0.22"/>
  </g>
  <g class="w1">
    <path d="M0 168 Q213 150 427 168 T854 168 V180 H0 Z" fill="url(#wave1)" opacity="0.32"/>
    <path d="M854 168 Q1067 150 1281 168 T1708 168 V180 H854 Z" fill="url(#wave1)" opacity="0.32"/>
  </g>

  <rect x="0" y="0" width="854" height="3" fill="url(#accent)"/>

  <text x="427" y="98" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="38" font-weight="700" fill="#FFFFFF" letter-spacing="0.4">Engineer · 4 Years Experience</text>

  <rect x="377" y="116" width="100" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
